name: demo-unit-tests

on:
  push:
    paths:
      - "demo-unit-tests/**"
      - ".github/workflows/demo-unit-tests.yml"
  pull_request:
    paths:
      - "demo-unit-tests/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["17", "21"]
    defaults:
      run:
        working-directory: demo-unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Run tests
        run: mvn -B clean test
