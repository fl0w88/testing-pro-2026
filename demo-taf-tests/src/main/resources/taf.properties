# Configuration of the test automation framework (TAF).
# Every value can be overridden on the command line, e.g.:  mvn test -Dbrowser.headless=true

# ---- Applications under test ------------------------------------------------------------
base64.encode.url=https://www.base64encode.org/
base64.decode.url=https://www.base64decode.org/

# ---- Browser ----------------------------------------------------------------------------
# true = no visible browser window. Note: base64decode.org shows a bot check to headless browsers,
# so the decode tests are skipped in headless mode.
browser.headless=false
browser.window.width=1400
browser.window.height=1000
# How long the framework waits at most for an element / condition
browser.timeout.seconds=10
